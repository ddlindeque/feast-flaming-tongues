# Feast of the Flaming Tongues, published like ParaScript.
# LAN:        http://lindeque-family-server:8090
# Cloudflare: http://127.0.0.1:8090

services:
  feast:
    build: .
    image: feast-flaming-tongues
    restart: unless-stopped
    environment:
      PORT: "4173"
      TRUST_PROXY: "1"
    ports:
      - "8090:4173"
    volumes:
      - ./feast.env:/app/feast.env:ro
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + process.env.PORT + "/login").then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
